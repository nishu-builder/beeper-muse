name: Bug report
description: Report a reproducible connector problem.
body:
  - type: markdown
    attributes:
      value: Do not include tokens, private chat contents, registration files, or browser profiles.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe expected and actual behavior using a synthetic prompt.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Extension version, OS, Chrome, and Beeper versions; note whether Desktop and mobile differ.
    validations:
      required: true
